{% extends 'base.html' %}

{% block title %}Register - CanteenFlow{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon-circle">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2 class="brand-font">Create Account</h2>
            <p class="text-muted small">Join CanteenFlow to order your favorite meals quickly</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}" id="registerForm">
            <div class="form-group-custom">
                <label for="username" class="form-label-custom">
                    <i class="fa-regular fa-user text-primary me-1"></i> Username
                </label>
                <input type="text" class="form-control-custom" id="username" name="username" placeholder="Choose a username" required minlength="3" autocomplete="username">
                <div class="form-text small text-muted">Minimum 3 characters</div>
            </div>

            <div class="form-group-custom">
                <label for="password" class="form-label-custom">
                    <i class="fa-solid fa-lock text-primary me-1"></i> Password
                </label>
                <input type="password" class="form-control-custom" id="password" name="password" placeholder="Create a strong password" required minlength="4" autocomplete="new-password">
                <div class="form-text small text-muted">Minimum 4 characters</div>
            </div>

            <div class="form-group-custom">
                <label for="confirm_password" class="form-label-custom">
                    <i class="fa-solid fa-shield-halved text-primary me-1"></i> Confirm Password
                </label>
                <input type="password" class="form-control-custom" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required autocomplete="new-password">
            </div>

            <button type="submit" class="btn-primary-custom mt-2">
                <i class="fa-solid fa-arrow-right"></i> Register Account
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <p class="small text-muted mb-0">Already have an account? 
                <a href="{{ url_for('login') }}" class="fw-bold">Sign In here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
