{% extends 'base.html' %}

{% block title %}Sign In - CanteenFlow{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon-circle">
                <i class="fa-solid fa-right-to-bracket"></i>
            </div>
            <h2 class="brand-font">Welcome Back</h2>
            <p class="text-muted small">Sign in to browse the daily menu and order food</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group-custom">
                <label for="username" class="form-label-custom">
                    <i class="fa-regular fa-user text-primary me-1"></i> Username
                </label>
                <input type="text" class="form-control-custom" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
            </div>

            <div class="form-group-custom">
                <label for="password" class="form-label-custom">
                    <i class="fa-solid fa-lock text-primary me-1"></i> Password
                </label>
                <input type="password" class="form-control-custom" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-primary-custom mt-2">
                <i class="fa-solid fa-utensils"></i> Sign In to Order
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <p class="small text-muted mb-0">Don't have an account yet? 
                <a href="{{ url_for('register') }}" class="fw-bold">Register here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
